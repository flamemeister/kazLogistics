version: '3.9'

services:
  react-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5175:5175"
    volumes:
      - .:/client
    stdin_open: true
    tty: true

  django-app:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8009:8009"
    volumes:
      - ./server:/app
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
    stdin_open: true
    tty: true



