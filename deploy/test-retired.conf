# Retired test frontend: retain HTTPS links and HTTP certificate renewal.
server {
    listen 80;
    server_name test.gslog.kz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / { return 301 https://gslog.kz$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.gslog.kz;
    ssl_certificate /etc/letsencrypt/live/test.gslog.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.gslog.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://gslog.kz$request_uri;
}
