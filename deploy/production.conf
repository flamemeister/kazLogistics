server {
    listen 80;
    server_name gslog.kz www.gslog.kz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location /.well-known/pki-validation/ { root /var/www/html; }
    location / { return 301 https://gslog.kz$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gslog.kz www.gslog.kz;
    root /var/www/gslog-production/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/gslog.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gslog.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json application/geo+json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8009;
        proxy_set_header Host bot.gslog.kz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /chat/ {
        proxy_pass http://127.0.0.1:8009;
        proxy_set_header Host bot.gslog.kz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location /media/ { try_files $uri =404; }
    location /fonts/ { try_files $uri =404; }
    location /maps/ {
        types { application/json json; application/geo+json geojson; text/plain md; }
        try_files $uri =404;
    }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
