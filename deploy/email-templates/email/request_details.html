<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  bgcolor="#f5f8f1"
  style="background-color: #f5f8f1; border: 1px solid #dfe8d7"
>
  {% if show_name %}
  <tr class="detail-row">
    <td
      class="detail-label"
      width="104"
      valign="top"
      style="
        width: 104px;
        padding: 18px 16px;
        color: #6b7c60;
        font-size: 12px;
        line-height: 21px;
        border-bottom: 1px solid #e0e8da;
      "
    >
      Имя
    </td>
    <td
      class="detail-value"
      valign="top"
      style="
        padding: 18px 16px 18px 0;
        color: #23452f;
        font-size: 14px;
        line-height: 21px;
        border-bottom: 1px solid #e0e8da;
        word-break: break-word;
        overflow-wrap: anywhere;
      "
    >
      {{ name }}
    </td>
  </tr>
  {% endif %}
  <tr class="detail-row">
    <td
      class="detail-label"
      width="104"
      valign="top"
      style="
        width: 104px;
        padding: 18px 16px;
        color: #6b7c60;
        font-size: 12px;
        line-height: 21px;
        border-bottom: 1px solid #e0e8da;
      "
    >
      Телефон
    </td>
    <td
      class="detail-value"
      valign="top"
      style="
        padding: 18px 16px 18px 0;
        font-size: 14px;
        line-height: 21px;
        border-bottom: 1px solid #e0e8da;
        word-break: break-word;
        overflow-wrap: anywhere;
      "
    >
      <a href="tel:{{ phone }}" style="color: #23452f; text-decoration: none"
        >{{ phone }}</a
      >
    </td>
  </tr>
  <tr class="detail-row">
    <td
      class="detail-label"
      width="104"
      valign="top"
      style="
        width: 104px;
        padding: 18px 16px;
        color: #6b7c60;
        font-size: 12px;
        line-height: 21px;
        border-bottom: 1px solid #e0e8da;
      "
    >
      Email
    </td>
    <td
      class="detail-value"
      valign="top"
      style="
        padding: 18px 16px 18px 0;
        font-size: 14px;
        line-height: 21px;
        border-bottom: 1px solid #e0e8da;
        word-break: break-all;
        overflow-wrap: anywhere;
      "
    >
      <a href="mailto:{{ email }}" style="color: #23452f; text-decoration: none"
        >{{ email }}</a
      >
    </td>
  </tr>
  <tr class="detail-row">
    <td
      class="detail-label"
      width="104"
      valign="top"
      style="
        width: 104px;
        padding: 18px 16px;
        color: #6b7c60;
        font-size: 12px;
        line-height: 21px;
      "
    >
      Комментарий
    </td>
    <td
      class="detail-value"
      valign="top"
      style="
        padding: 18px 16px 18px 0;
        color: #23452f;
        font-size: 14px;
        line-height: 22px;
        word-break: break-word;
        overflow-wrap: anywhere;
      "
    >
      {{ comment|default:"—"|linebreaksbr }}
    </td>
  </tr>
</table>
