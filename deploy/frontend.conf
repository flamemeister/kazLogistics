server {
    listen 127.0.0.1:8081;
    server_name test.gslog.kz;
    root /var/www/gslog-test/current;
    index index.html;
    access_log /var/log/nginx/gslog-test.access.log;
    error_log /var/log/nginx/gslog-test.error.log;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json application/geo+json image/svg+xml;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ {
        proxy_pass http://127.0.0.1:8009;
        proxy_set_header Host bot.gslog.kz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /chat/ {
        proxy_pass http://127.0.0.1:8009;
        proxy_set_header Host bot.gslog.kz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location /media/ { try_files $uri =404; }
    location /fonts/ { try_files $uri =404; }
    location /maps/ {
        types { application/json json; application/geo+json geojson; text/plain md; }
        try_files $uri =404;
    }
    location = /index.html { add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; }
    location / { try_files $uri $uri/ /index.html; }
}
